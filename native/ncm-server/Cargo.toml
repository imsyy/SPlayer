[package]
name = "ncm-server"
version = "0.1.0"
edition = "2021"
description = "SPlayer Rust API server sidecar"

[dependencies]
# Netease Cloud Music API
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git", features = ["server"] }

# HTTP / Web
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# QRC 歌词解密
des = "0.8"
flate2 = "1"
hex = "0.4"

# Utils
urlencoding = "2"
rand = "0.8"
base64 = "0.22"
anyhow = "1"
