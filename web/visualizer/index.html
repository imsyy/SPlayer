<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .visualizer-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: transparent;
      overflow: hidden;
    }

    .visualizer-bar {
      width: 100%;
      height: 0;
      transition: height 0.03s ease-out, border-radius 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="visualizer-container">
    <div class="visualizer-bar" id="bar"></div>
  </div>

  <script>
    const state = {
      color: '239, 239, 239',
      opacity: 1,
      shape: 'rectangle',
      gradient: false,
      currentHeight: 0,
    };

    const urlParams = new URLSearchParams(window.location.search);
    const side = urlParams.get('side') || 'left';

    const bar = document.getElementById('bar');
    
    const RADIUS_MAP = { rectangle: '0', pill: '50px', rounded: '6px' };
    
    function getRadius() {
      const radius = RADIUS_MAP[state.shape] || '6px';
      return state.gradient && radius !== '0' ? `0 0 ${radius} ${radius}` : radius;
    }

    function getBackground() {
      const { color, opacity, gradient } = state;
      return gradient 
        ? `linear-gradient(to top, rgba(${color}, ${opacity}) 0%, rgba(${color}, ${opacity}) 60%, rgba(${color}, 0) 100%)`
        : `rgba(${color}, ${opacity})`;
    }

    function getBoxShadow() {
      return state.gradient ? 'none' : `0 0 15px rgba(${state.color}, ${state.opacity * 0.5})`;
    }

    function updateStyle() {
      bar.style.background = getBackground();
      bar.style.boxShadow = getBoxShadow();
      bar.style.borderRadius = getRadius();
    }

    function lerp(start, end, factor) {
      return (1 - factor) * start + factor * end;
    }

    const LERP_UP = 0.85;
    const LERP_DOWN = 0.08;
    const MIN_DIFF = 3;
    
    function handleAudioData(data) {
      const targetHeight = Math.min(data * 100, 95);
      const diff = Math.abs(targetHeight - state.currentHeight);

      if (diff < MIN_DIFF && targetHeight > 0 && state.currentHeight > 0) return;

      const lerpFactor = targetHeight > state.currentHeight ? LERP_UP : LERP_DOWN;
      state.currentHeight = lerp(state.currentHeight, targetHeight, lerpFactor);
      bar.style.height = `${state.currentHeight}%`;
    }
    if (window.electron?.ipcRenderer) {
      const ipc = window.electron.ipcRenderer;

      ipc.send('visualizer-ready');
      ipc.on('audio-data', (_, data) => handleAudioData(data));

      ipc.on('update-theme', (_, val) => {
        state.color = val;
        updateStyle();
        requestAnimationFrame(() => ipc.send('visualizer-show', side));
      });

      const updateHandlers = {
        'update-visualizer-opacity': 'opacity',
        'update-visualizer-shape': 'shape',
        'update-visualizer-gradient': 'gradient'
      };

      Object.entries(updateHandlers).forEach(([channel, key]) => {
        ipc.on(channel, (_, val) => {
          state[key] = val;
          updateStyle();
        });
      });
    }

    updateStyle();
  </script>
</body>
</html>
